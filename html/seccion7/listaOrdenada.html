<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas Ordenadas</title>
    <link rel="stylesheet" href="/css/seccion7/estilos7-1.css">
</head>
<body>
    <!--Ordered list-->
    <!--En type se encuentra A (mayusculas) a (minisculas) 1 (numeros) I(romanos mayusculas) i (romanos minisculas)-->
    <ol type="I">
        <li>Calculo</li>
        <li>Matematicas</li>
        <li>Fisica</li>
    </ol>
</body>
</html>
