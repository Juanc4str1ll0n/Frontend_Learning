<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tablas en HTML</title>
    <link rel="stylesheet" href="../../css/estilos_table.css">
</head>
<body>
    <table border="1">
        <!--Tr = table row-->
        <!--Th = table header-->
        <!--Td = table data-->
        <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>Juan</td>
            <td>Perez</td>
            <td>jperez@gmail.com</td>
        </tr>
    </table>
    <hr>
    <br>
    <h2>Tabla con celdas combinadas</h2>
    <table>
        <!--con rowspan se combinan celdas de fila y se indica cuantas-->
        <!--Con colspan se combinan celdas de columna y se indica cuantas celdas-->
        <tr>
            <th colspan="2"> Nombres Completos </th>
            <th> Numero telefonico</th>
        </tr>
        <tr>
            <td colspan="2">Juan Fernando Perez Rodriguez</td>
            <td>31285623243</td>
        </tr>
    </table>

    <br>
    <!--Tabla con buenos estilos-->
    <table>
        <tr>

        </tr>
        <tr>
            
        </tr>
    </table>
</body>
</html>
