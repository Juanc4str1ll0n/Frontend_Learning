<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas en HTML</title>
</head>
<body>
    <h1>Listas No ordenadas (Unorder list)</h1>
    <!--Por estilos las listas no ordenadas tienen punto como viñeta-->
    <!--Para cambiarla aplicamos estilos-->
    <ul style="list-style-type: lower-roman;">
        <li>Juan</li>
        <li>David</li>
        <li>Felipe</li>
        <!--Aqui podemos hacer listas anidadas de igual manera poniendo otra lista sobre un item li-->
        <li>
            Steven
            <ul>
                <li>Celular: 3125108927</li>
            </ul>
        </li>
    </ul>

</body>
</html>
