<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas de descripcion en html</title>
</head>
<body>
    <h1>Lenguajes de programacion</h1>
    <!--dl -> description list // dt -> description term  // dd -> description data  -->
    <dl>
        <dt>Java</dt>
        <dd>Creador: James Gosling</dd>

        <dt>Python</dt>
        <dd>Creador: Guido van Rossum</dd>

        <dt>JavaScript</dt>
        <dd>Creador: Brendan Eich</dd>
    </dl>
</body>
</html>
