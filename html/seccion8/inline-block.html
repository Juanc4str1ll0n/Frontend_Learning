    <title>Elementos inline y block</title>
</head>
<body>
    <!--Los elementos block se situan uno debajo de otro=-->
    <h1 style="background-color: aqua;">Elementos block</h1>
    <p>hola xd</p>

    <!--Los elementos in line solo ocupan el espacio estructamente necesario para su contenido y permiten que otros elementos se pongan a su lado-->

    <span style="background-color: aqua;">
        soy un texto bonito xd
    </span>
    <span>
        holaaaaaaaaaaaaa
    </span>

</body>
